# job-hunt search configuration
#
# profiles: one entry per search you want run every day. Add as many as you like —
# each is searched independently against LinkedIn, then merged before dedup/scoring.
#
# relevance_threshold: minimum score (1-10) a job must hit to be shortlisted.
# max_shortlist: safety cap on shortlisted jobs per run, regardless of how many clear the threshold.
#
# min_shortlist: if fewer than this many jobs clear relevance_threshold, the next
# highest-scoring below-threshold jobs are backfilled in (still real stage-2
# candidates that passed the experience cap and blacklist) until min_shortlist is
# reached or candidates run out. Backfilled jobs are marked in shortlist.md so
# they're never mistaken for ones that cleared the bar organically. See docs/adr/0004.
#
# location_preference: soft signal for relevance scoring only, not a search filter.
# Earlier cities score higher than later ones when two postings are otherwise similar.
# Remote postings aren't ranked against this list — remote is a first-order preference
# in its own right (see the "profiles" entry below), not a slot in the city ordering.
#
# max_years_experience: jobs whose core-role requirement exceeds this many years of
# experience are rejected outright during scoring, regardless of relevance score.
#
# target_companies: every job at one of these companies gets a qualitative boost in
# relevance scoring (see docs/adr/0002). Edit this list anytime.
#
# wider_net_companies: a subset of target_companies that additionally gets dedicated
# search profiles (LinkedIn's search has no company filter, so a boost alone can't
# surface postings the generic profiles above never fetched). Must be a subset of
# target_companies. Keep this short — each entry adds several extra searches per run.
#
# blacklist_companies: jobs at these companies are dropped before scoring — never
# shortlisted, tailored, or pushed to the Job Tracker.

relevance_threshold: 6.0
max_shortlist: 50
min_shortlist: 15
max_years_experience: 4

location_preference:
  - Noida
  - Bengaluru
  - Hyderabad

target_companies:
  - Adobe
  - Microsoft
  - Amazon
  - Google
  - eBay
  - Salesforce
  - JP Morgan
  - Visa
  - Mastercard
  - Arcesium
  - Wells Fargo
  - Twilio
  - LSEG
  - ServiceNow
  - Apple
  - Gitlab
  - Atlassian
  - Akamai
  - Rippling
  - Cohesity
  - Cloudflare
  - Walmart
  - Nvidia
  - PayU
  - Stripe
  - Netflix
  - VMware
  - Slack
  - Docusign
  - Databricks
  - MongoDB
  - Zoom
  - HashiCorp
  - Shopify
  - Snowflake
  - Palantir

wider_net_companies:
