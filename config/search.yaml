  - TCS
  - Infosys
  - Wipro
  - HCL
  - Capgemini
  - Tech Mahindra
  - Cognizant
  - Accenture

profiles:
  - keywords: "Software Engineer"
    location: "India"
    work_type: "remote"
    experience_level: "mid_senior"
  - keywords: "Software Engineer"
    location: "Noida"
    work_type: "on_site,hybrid"
    experience_level: "mid_senior"
  - keywords: "Software Engineer"
    location: "Bengaluru"
    work_type: "on_site,hybrid"
    experience_level: "mid_senior"
  - keywords: "Software Engineer"
    location: "Hyderabad"
    work_type: "on_site,hybrid"
    experience_level: "mid_senior"
