  - Walmart
  - Nvidia
  - PayU
  - Stripe
  - Netflix
  - VMware
  - Slack
  - Docusign
  - Databricks
  - MongoDB
  - Zoom
  - HashiCorp
  - Shopify
  - Snowflake
